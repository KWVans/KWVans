<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="190" viewBox="0 0 1000 190" role="img" aria-labelledby="title desc">
  <title id="title">Project workflow</title>
  <desc id="desc">A five-step process: understand, plan, build, validate, and ship.</desc>
  <defs><linearGradient id="flow" x1="0" x2="1"><stop stop-color="#56d4ff"/><stop offset=".5" stop-color="#8b8cff"/><stop offset="1" stop-color="#73ddb2"/></linearGradient></defs>
  <rect x="1" y="1" width="998" height="188" rx="16" fill="#0d1117" stroke="#30363d"/>
  <text x="28" y="37" fill="#e6edf3" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="1.3">FROM IDEA TO RELEASE</text>
  <path d="M110 91H890" stroke="#30363d" stroke-width="3"/>
  <path d="M110 91H890" stroke="url(#flow)" stroke-width="3"/>
  <g font-family="Segoe UI,Arial,sans-serif" text-anchor="middle">
    <g transform="translate(110 91)"><circle r="20" fill="#142942" stroke="#56d4ff" stroke-width="2"/><text y="6" fill="#56d4ff" font-size="15" font-weight="700">1</text><text y="48" fill="#f0f6fc" font-size="13" font-weight="700">Understand</text><text y="67" fill="#8b949e" font-size="10">Goals &amp; needs</text></g>
    <g transform="translate(305 91)"><circle r="20" fill="#1b1b3a" stroke="#8b8cff" stroke-width="2"/><text y="6" fill="#a5a6ff" font-size="15" font-weight="700">2</text><text y="48" fill="#f0f6fc" font-size="13" font-weight="700">Plan</text><text y="67" fill="#8b949e" font-size="10">Structure &amp; scope</text></g>
    <g transform="translate(500 91)"><circle r="20" fill="#1b2c26" stroke="#56c596" stroke-width="2"/><text y="6" fill="#73ddb2" font-size="15" font-weight="700">3</text><text y="48" fill="#f0f6fc" font-size="13" font-weight="700">Build</text><text y="67" fill="#8b949e" font-size="10">Focused iterations</text></g>
    <g transform="translate(695 91)"><circle r="20" fill="#30251a" stroke="#f0aa61" stroke-width="2"/><text y="6" fill="#ffc078" font-size="15" font-weight="700">4</text><text y="48" fill="#f0f6fc" font-size="13" font-weight="700">Validate</text><text y="67" fill="#8b949e" font-size="10">Test key flows</text></g>
    <g transform="translate(890 91)"><circle r="20" fill="#173326" stroke="#73ddb2" stroke-width="2"/><text y="6" fill="#73ddb2" font-size="15" font-weight="700">5</text><text y="48" fill="#f0f6fc" font-size="13" font-weight="700">Ship</text><text y="67" fill="#8b949e" font-size="10">Deploy &amp; improve</text></g>
  </g>
</svg>
