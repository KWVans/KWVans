name: Update Profile Stats

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

jobs:
  update-cards:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Verify private stats token is configured
        env:
          GH_STATS_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
        run: |
          if [ -z "$GH_STATS_TOKEN" ]; then
            echo "::error::GH_STATS_TOKEN is unavailable. Add it as a repository Actions secret and rerun this workflow."
            exit 1
          fi

      - name: Generate GitHub stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=KWVans&show_icons=true&theme=tokyonight&hide_border=true&include_all_commits=true
          path: profile/stats.svg
          token: ${{ secrets.GH_STATS_TOKEN }}
          fail_on_error: true

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=KWVans&layout=compact&langs_count=8&theme=tokyonight&hide_border=true
          path: profile/top-langs.svg
          token: ${{ secrets.GH_STATS_TOKEN }}
          fail_on_error: true

      - name: Commit updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git diff --cached --quiet && exit 0
          git commit -m "Update profile stats cards"
          git push
