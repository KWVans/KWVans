name: Update Profile Stats

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

jobs:
  update-cards:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Verify private stats token is configured
        env:
          GH_STATS_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
        run: |
          if [ -z "$GH_STATS_TOKEN" ]; then
            echo "::error::GH_STATS_TOKEN is unavailable. Add it as a repository Actions secret and rerun this workflow."
            exit 1
          fi

          api="https://api.github.com"
          login=$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_STATS_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$api/user" | jq -r '.login')
          if [ "$login" != "KWVans" ]; then
            echo "::error::GH_STATS_TOKEN authenticated as '$login', but the stats are for KWVans. Use a token created by the KWVans account."
            exit 1
          fi

          private_repo_count=$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_STATS_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$api/user/repos?visibility=private&per_page=1" | jq 'length')
          if [ "$private_repo_count" -lt 1 ]; then
            echo "::error::GH_STATS_TOKEN cannot access any private repositories. Check its repo scope and repository/organization access. No repository names were logged."
            exit 1
          fi
          echo "Token identity and private-repository access verified."

      - name: Generate GitHub contribution timeline
        env:
          GH_STATS_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
        run: python scripts/generate-contribution-timeline.py

      - name: Generate GitHub stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=KWVans&show_icons=true&theme=tokyonight&hide_border=true&include_all_commits=true&show=contributions,all_time_contribs&contribs_include_own_repos=true
          path: profile/stats.svg
          token: ${{ secrets.GH_STATS_TOKEN }}
          fail_on_error: true

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=KWVans&layout=compact&langs_count=8&theme=tokyonight&hide_border=true
          path: profile/top-langs.svg
          token: ${{ secrets.GH_STATS_TOKEN }}
          fail_on_error: true

      - name: Commit updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git diff --cached --quiet && exit 0
          git commit -m "Update profile stats cards"
          git push
